    <meta

      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(display-mode: standalone)" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta
      name="description"
      content="FlowField Pro is a field-ready app for backflow assembly testing. Built for testers. Purveyor portal coming soon."
    />
    <title>FlowField Pro — Backflow testing in the field</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('flowfield.theme') || 'system'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var chrome = dark ? '#0b1220' : '#f8fafc'
          document.documentElement.style.backgroundColor = chrome
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', chrome)
        } catch (e) {}
      })()
    </script>
